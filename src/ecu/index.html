<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Controller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Syne:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ── Base ───────────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:       #0d0e14;
  --surface:  #13151e;
  --card:     #181b27;
  --border:   #21253a;
  --border2:  #2c3150;
  --text:     #dde1f0;
  --muted:    #5a6080;
  --accent:   #5b6ef5;
  --accent2:  #f5825b;
  --green:    #3dd68c;
  --red:      #f5605b;
  --radius:   10px;
}
body {
  font-family: 'Syne', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ── Header ─────────────────────────────────────────────────────────────── */
header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}
.logo { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; color: var(--text); }
.logo span { color: var(--accent); }
.ws-badge {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 11px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--muted);
}
.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--red);
  transition: background .3s;
}
.dot.ok { background: var(--green); }

/* ── Tabs ────────────────────────────────────────────────────────────────── */
.tabbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  padding: 0 24px;
  flex-shrink: 0;
}
.tab-btn {
  padding: 10px 18px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: transparent;
  border-bottom: 2px solid transparent;
  transition: color .2s, border-color .2s;
  user-select: none;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }

/* ── Panels ──────────────────────────────────────────────────────────────── */
.panel { display: none; flex: 1; overflow-y: auto; padding: 20px 24px; }
.panel.active { display: flex; flex-direction: column; gap: 16px; }

/* ── Card ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
}
.card-title {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 14px;
}

/* ── Two-col layout (PID tab) ─────────────────────────────────────────────── */
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .row2 { grid-template-columns: 1fr; } }

/* ── Sliders ─────────────────────────────────────────────────────────────── */
.sl-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.sl-row:last-child { margin-bottom: 0; }
.sl-lbl {
  width: 34px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  color: var(--muted);
}
.sl-row input[type=range] {
  flex: 1;
  -webkit-appearance: none;
  height: 3px;
  background: var(--border2);
  border-radius: 2px;
  outline: none;
}
.sl-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
  transition: transform .1s;
}
.sl-row input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.2); }
.sl-val {
  width: 46px;
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  color: var(--text);
}

/* ── Speed boxes ──────────────────────────────────────────────────────────── */
.spd-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.spd-box {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  text-align: center;
}
.spd-box .label { font-size: 10px; color: var(--muted); margin-bottom: 4px; }
.spd-box .num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 26px;
  font-weight: 600;
  color: var(--accent);
  line-height: 1;
}
.spd-box .unit { font-size: 10px; color: var(--muted); margin-top: 2px; }

/* ── Arrow keys ──────────────────────────────────────────────────────────── */
.keys-hint { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.keys-row  { display: flex; gap: 4px; }
.key-cap {
  width: 38px; height: 38px;
  background: var(--bg);
  border: 1px solid var(--border2);
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  color: var(--muted);
  transition: background .1s, color .1s, border-color .1s;
  user-select: none;
}
.key-cap.lit { background: var(--accent); border-color: var(--accent); color: #fff; }
.keys-desc {
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  margin-top: 6px;
}
.stop-btn {
  display: block;
  width: 100%;
  margin-top: 12px;
  padding: 8px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.stop-btn:hover { border-color: var(--red); color: var(--red); }

/* ── Chart ────────────────────────────────────────────────────────────────── */
.chart-wrap { position: relative; height: 260px; }

/* ── Serial log ──────────────────────────────────────────────────────────── */
.serial-log {
  background: #080910;
  border: 1px solid var(--border);
  border-radius: 8px;
  height: 110px;
  overflow-y: auto;
  padding: 9px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: #4dd68c;
  line-height: 1.55;
  word-break: break-all;
}

/* ── Camera tab ──────────────────────────────────────────────────────────── */
.cam-bar { display: flex; gap: 8px; }
.cam-bar input {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  outline: none;
  transition: border-color .2s;
}
.cam-bar input:focus { border-color: var(--accent); }
.btn-accent {
  padding: 8px 16px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: opacity .2s;
}
.btn-accent:hover { opacity: .85; }
.cam-frame {
  width: 100%;
  aspect-ratio: 16/9;
  background: #000;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.cam-frame iframe,
.cam-frame img { width: 100%; height: 100%; border: none; display: block; }

/* ── LED tab ─────────────────────────────────────────────────────────────── */
.led-preview {
  width: 100%;
  height: 52px;
  border-radius: 8px;
  background: #000;
  border: 1px solid var(--border);
  margin-bottom: 14px;
  transition: background .25s;
  box-shadow: 0 0 0 0 transparent;
}
.color-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin: 14px 0;
}
.col-btn {
  height: 46px;
  border-radius: 8px;
  border: 2px solid transparent;
  cursor: pointer;
  font-size: 11px;
  font-weight: 700;
  color: rgba(255,255,255,.85);
  display: flex; align-items: center; justify-content: center;
  transition: transform .15s, border-color .15s;
}
.col-btn.dark { color: rgba(0,0,0,.6); }
.col-btn:hover { transform: scale(1.06); }
.col-btn.sel { border-color: #fff; transform: scale(1.06); }
.led-actions { display: flex; gap: 8px; }
.btn-off {
  padding: 9px 16px;
  border: 1px solid var(--border2);
  background: transparent;
  color: var(--muted);
  border-radius: 8px;
  font-family: 'Syne', sans-serif;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: border-color .2s, color .2s;
}
.btn-off:hover { border-color: var(--red); color: var(--red); }

/* ── Scrollbar ────────────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<!-- ═══════════════════════════════ HEADER ════════════════════════════════ -->
<header>
  <div class="logo">turtle<span>bot</span></div>
  <div class="ws-badge">
    <div class="dot" id="wsDot"></div>
    <span id="wsLabel">offline</span>
  </div>
</header>

<!-- ════════════════════════════════ TABBAR ═══════════════════════════════ -->
<div class="tabbar">
  <button class="tab-btn active" onclick="switchTab('pid',this)">PID &amp; Управление</button>
  <button class="tab-btn"        onclick="switchTab('cam',this)">Камера</button>
  <button class="tab-btn"        onclick="switchTab('led',this)">LED лента</button>
</div>

<!-- ══════════════════════════ TAB 1 – PID & Control ═════════════════════ -->
<div id="panel-pid" class="panel active">

  <div class="row2">
    <!-- PID sliders -->
    <div class="card">
      <div class="card-title">PID коэффициенты</div>

      <div class="sl-row">
        <span class="sl-lbl">Kp</span>
        <input type="range" id="kp" min="0" max="10" step="0.1" value="2.0"
               oninput="onPidInput()">
        <span class="sl-val" id="kp-v">2.0</span>
      </div>
      <div class="sl-row">
        <span class="sl-lbl">Ki</span>
        <input type="range" id="ki" min="0" max="10" step="0.1" value="2.5"
               oninput="onPidInput()">
        <span class="sl-val" id="ki-v">2.5</span>
      </div>
      <div class="sl-row">
        <span class="sl-lbl">Kd</span>
        <input type="range" id="kd" min="0" max="10" step="0.01" value="0.00"
               oninput="onPidInput()">
        <span class="sl-val" id="kd-v">0.00</span>
      </div>
      <div class="sl-row">
        <span class="sl-lbl">Kff</span>
        <input type="range" id="kff" min="0" max="1" step="0.05" value="0.30"
               oninput="onPidInput()">
        <span class="sl-val" id="kff-v">0.30</span>
      </div>
    </div>

    <!-- Wheel speed control -->
    <div class="card">
      <div class="card-title">Управление колёсами</div>

      <div class="spd-grid">
        <div class="spd-box">
          <div class="label">Левое</div>
          <div class="num" id="spdL">0</div>
          <div class="unit">мм/с</div>
        </div>
        <div class="spd-box">
          <div class="label">Правое</div>
          <div class="num" id="spdR">0</div>
          <div class="unit">мм/с</div>
        </div>
      </div>

      <div class="keys-hint">
        <div class="keys-row">
          <div class="key-cap" id="kUp">↑</div>
        </div>
        <div class="keys-row">
          <div class="key-cap" id="kLeft">←</div>
          <div class="key-cap" id="kDown">↓</div>
          <div class="key-cap" id="kRight">→</div>
        </div>
        <div class="keys-desc">Стрелки: ±50 мм/с · работают на этой вкладке</div>
      </div>

      <button class="stop-btn" onclick="stopWheels()">⏹ СТОП</button>
    </div>
  </div>

  <!-- Chart -->
  <div class="card">
    <div class="card-title">График скоростей — окно 20 с</div>
    <div class="chart-wrap">
      <canvas id="chart"></canvas>
    </div>
  </div>

  <!-- Serial log -->
  <div class="card">
    <div class="card-title">Serial log</div>
    <div class="serial-log" id="log"></div>
  </div>

</div><!-- /panel-pid -->

<!-- ════════════════════════════ TAB 2 – Camera ══════════════════════════ -->
<div id="panel-cam" class="panel">
  <div class="card">
    <div class="card-title">Веб-камера (go2rtc MJPEG)</div>
    <div class="cam-bar" style="margin-bottom:12px">
      <input type="text" id="camUrl"
             value="http://192.168.1.97:1984/stream.html?src=webcam"
             placeholder="URL потока">
      <button class="btn-accent" onclick="loadCam()">Применить</button>
    </div>
    <div class="cam-frame">
      <iframe id="camFrame" src="" allow="autoplay; camera"></iframe>
    </div>
  </div>
</div>

<!-- ═══════════════════════════ TAB 3 – LED ══════════════════════════════ -->
<div id="panel-led" class="panel">
  <div class="card" style="max-width:480px">
    <div class="card-title">LED лента</div>

    <!-- live preview bar -->
    <div class="led-preview" id="ledBar"></div>

    <!-- brightness -->
    <div class="sl-row">
      <span class="sl-lbl" style="width:64px;font-size:12px">Яркость</span>
      <input type="range" id="bright" min="0" max="255" step="1" value="200"
             oninput="onLedChange()">
      <span class="sl-val" id="bright-v">200</span>
    </div>

    <!-- color palette -->
    <div class="color-grid" id="colorGrid"></div>

    <div class="led-actions">
      <button class="btn-accent" style="flex:1" onclick="sendLed()">Применить</button>
      <button class="btn-off" onclick="ledOff()">Выкл</button>
    </div>
  </div>
</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>
/* ═══════════════════════════ WebSocket ══════════════════════════════════ */
let ws = null, reconnTimer = null;

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws`);

  ws.onopen = () => {
    document.getElementById('wsDot').classList.add('ok');
    document.getElementById('wsLabel').textContent = 'online';
    clearTimeout(reconnTimer);
  };
  ws.onclose = ws.onerror = () => {
    document.getElementById('wsDot').classList.remove('ok');
    document.getElementById('wsLabel').textContent = 'offline';
    ws = null;
    reconnTimer = setTimeout(connectWS, 3000);
  };
  ws.onmessage = e => handleLine(e.data);
}

function send(cmd) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(cmd);
}

/* ═══════════════════════════ Tab switching ══════════════════════════════ */
let activeTab = 'pid';

function switchTab(name, btn) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  btn.classList.add('active');
  activeTab = name;
  if (name === 'cam') loadCam();
}

/* ═══════════════════════════ PID sliders ════════════════════════════════ */
let pidTimer = null;

function onPidInput() {
  const kp  = +document.getElementById('kp').value;
  const ki  = +document.getElementById('ki').value;
  const kd  = +document.getElementById('kd').value;
  const kff = +document.getElementById('kff').value;

  document.getElementById('kp-v').textContent  = kp.toFixed(1);
  document.getElementById('ki-v').textContent  = ki.toFixed(1);
  document.getElementById('kd-v').textContent  = kd.toFixed(2);
  document.getElementById('kff-v').textContent = kff.toFixed(2);

  clearTimeout(pidTimer);
  pidTimer = setTimeout(() => {
    send(`SET_COEFF ${kp} ${ki} ${kd} ${kff}`);
  }, 120);
}

/* ═══════════════════════════ Wheel speed ════════════════════════════════ */
let spdL = 0, spdR = 0;
const STEP = 50, MAX = 500;
const held = new Set();

const KEY_MAP = {
  ArrowUp:    () => setSpeed(spdL + STEP, spdR + STEP),
  ArrowDown:  () => setSpeed(spdL - STEP, spdR - STEP),
  ArrowLeft:  () => setSpeed(spdL - STEP, spdR + STEP),
  ArrowRight: () => setSpeed(spdL + STEP, spdR - STEP),
};
const KEY_IDS = {
  ArrowUp:'kUp', ArrowDown:'kDown', ArrowLeft:'kLeft', ArrowRight:'kRight'
};

function clamp(v) { return Math.max(-MAX, Math.min(MAX, v)); }

function setSpeed(l, r) {
  spdL = clamp(l); spdR = clamp(r);
  document.getElementById('spdL').textContent = spdL;
  document.getElementById('spdR').textContent = spdR;
  send(`SET_WHEELS_SPEED ${spdL} ${spdR}`);
}
function stopWheels() { setSpeed(0, 0); }

document.addEventListener('keydown', e => {
  if (activeTab !== 'pid') return;
  if (!KEY_MAP[e.key]) return;
  e.preventDefault();
  if (held.has(e.key)) return; // ignore key-repeat
  held.add(e.key);
  KEY_MAP[e.key]();
  const id = KEY_IDS[e.key];
  if (id) document.getElementById(id).classList.add('lit');
});

document.addEventListener('keyup', e => {
  held.delete(e.key);
  const id = KEY_IDS[e.key];
  if (id) document.getElementById(id).classList.remove('lit');
});

/* ═══════════════════════════ Chart ══════════════════════════════════════ */
const WINDOW_S = 20;
const t0 = Date.now();

const chart = new Chart(document.getElementById('chart'), {
  type: 'line',
  data: {
    datasets: [
      { label: 'Лев. факт',  borderColor: '#5b6ef5', borderWidth: 2,   pointRadius: 0, data: [] },
      { label: 'Лев. цель',  borderColor: '#5b6ef5', borderWidth: 1.5, pointRadius: 0, borderDash: [5,4], data: [] },
      { label: 'Прав. факт', borderColor: '#f5825b', borderWidth: 2,   pointRadius: 0, data: [] },
      { label: 'Прав. цель', borderColor: '#f5825b', borderWidth: 1.5, pointRadius: 0, borderDash: [5,4], data: [] },
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: false,
    interaction: { mode: 'index', intersect: false },
    scales: {
      x: {
        type: 'linear',
        title: { display: true, text: 'Время (с)', color: '#5a6080', font: { family: 'JetBrains Mono' } },
        ticks: { color: '#5a6080', font: { family: 'JetBrains Mono', size: 10 } },
        grid:  { color: '#181b27' }
      },
      y: {
        title: { display: true, text: 'мм/с', color: '#5a6080', font: { family: 'JetBrains Mono' } },
        ticks: { color: '#5a6080', font: { family: 'JetBrains Mono', size: 10 } },
        grid:  { color: '#181b27' }
      }
    },
    plugins: {
      legend: {
        labels: {
          color: '#9098b8',
          font: { family: 'Syne', size: 11 },
          boxWidth: 18,
          padding: 14
        }
      }
    }
  }
});

// rolling buffers (max ~2000 pts)
const pts = { t:[], ml:[], tl:[], mr:[], tr:[] };

function pushChart(ml, tl, mr, tr) {
  const t = (Date.now() - t0) / 1000;
  pts.t.push(t); pts.ml.push(ml); pts.tl.push(tl);
  pts.mr.push(mr); pts.tr.push(tr);

  // trim old
  while (pts.t.length > 0 && t - pts.t[0] > WINDOW_S + 5) {
    pts.t.shift(); pts.ml.shift(); pts.tl.shift();
    pts.mr.shift(); pts.tr.shift();
  }

  const build = arr => pts.t.map((x,i) => ({ x, y: arr[i] }));
  chart.data.datasets[0].data = build(pts.ml);
  chart.data.datasets[1].data = build(pts.tl);
  chart.data.datasets[2].data = build(pts.mr);
  chart.data.datasets[3].data = build(pts.tr);

  const now = t;
  chart.options.scales.x.min = now < WINDOW_S ? 0 : now - WINDOW_S;
  chart.options.scales.x.max = now < WINDOW_S ? WINDOW_S : now;
  chart.update('none');
}

/* ═══════════════════════════ Serial parsing ═════════════════════════════ */
const logEl   = document.getElementById('log');
const SPD_RE  = /SPD L=([\d.\-]+) mm\/s R=([\d.\-]+) mm\/s.*Target L=([\d.\-]+) mm\/s R=([\d.\-]+) mm\/s/;

function handleLine(line) {
  logEl.textContent += line + '\n';
  logEl.scrollTop = logEl.scrollHeight;
  if (logEl.textContent.length > 30000)
    logEl.textContent = logEl.textContent.slice(-15000);

  const m = SPD_RE.exec(line);
  if (m) pushChart(+m[1], +m[3], +m[2], +m[4]);
}

/* ═══════════════════════════ Camera ═════════════════════════════════════ */
let camLoaded = false;

function loadCam() {
  const url = document.getElementById('camUrl').value.trim();
  if (url) {
    document.getElementById('camFrame').src = url;
    camLoaded = true;
  }
}

/* ═══════════════════════════ LED ════════════════════════════════════════ */
const COLORS = [
  { name:'black',   label:'Off',     hex:'#111111', dark:false },
  { name:'white',   label:'White',   hex:'#ffffff', dark:true  },
  { name:'red',     label:'Red',     hex:'#ef4444', dark:false },
  { name:'green',   label:'Green',   hex:'#22c55e', dark:false },
  { name:'blue',    label:'Blue',    hex:'#3b82f6', dark:false },
  { name:'yellow',  label:'Yellow',  hex:'#fbbf24', dark:true  },
  { name:'cyan',    label:'Cyan',    hex:'#06b6d4', dark:false },
  { name:'magenta', label:'Magenta', hex:'#ec4899', dark:false },
  { name:'orange',  label:'Orange',  hex:'#f97316', dark:false },
  { name:'purple',  label:'Purple',  hex:'#a855f7', dark:false },
];

let selColor = 'red';

function renderColors() {
  const grid = document.getElementById('colorGrid');
  grid.innerHTML = '';
  COLORS.forEach(c => {
    const d = document.createElement('div');
    d.className = 'col-btn' + (c.dark ? ' dark' : '') + (c.name === selColor ? ' sel' : '');
    d.style.background = c.hex;
    d.textContent = c.label;
    d.onclick = () => { selColor = c.name; renderColors(); onLedChange(); };
    grid.appendChild(d);
  });
}

function onLedChange() {
  const br = +document.getElementById('bright').value;
  document.getElementById('bright-v').textContent = br;
  const c = COLORS.find(x => x.name === selColor);
  if (!c || c.name === 'black') {
    document.getElementById('ledBar').style.cssText =
      'background:#000; box-shadow:none';
    return;
  }
  const f  = br / 255;
  const r  = Math.round(parseInt(c.hex.slice(1,3),16) * f);
  const g  = Math.round(parseInt(c.hex.slice(3,5),16) * f);
  const b  = Math.round(parseInt(c.hex.slice(5,7),16) * f);
  document.getElementById('ledBar').style.cssText =
    `background:rgb(${r},${g},${b});` +
    `box-shadow:0 0 ${Math.round(br/4)}px rgb(${r},${g},${b})`;
}

function sendLed() {
  send(`SET_LED ${document.getElementById('bright').value} ${selColor}`);
}

function ledOff() {
  selColor = 'black';
  document.getElementById('bright').value = 0;
  renderColors();
  onLedChange();
  send('SET_LED 0 black');
}

/* ═══════════════════════════ Init ══════════════════════════════════════ */
renderColors();
onLedChange();
connectWS();
</script>
</body>
</html>
