name: Build release artifact

on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-release-artifact:
    name: Build release zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stage release files
        run: |
          set -euo pipefail

          mkdir -p release/bin release/music release/services release/config release/ws/src release/docker
          cp -a bin/. release/bin/
          cp -a music/. release/music/
          cp -a src/ecu/services/. release/services/
          cp -a src/ecu/config/. release/config/
          cp -a src/ecu/main.py release/main.py
          cp -a src/ecu/index.html release/index.html
          cp -a src/ecu/install.sh release/install.sh
          cp -a src/ecu/docker/. release/docker/
          cp -a src/ecu/ws/src/ release/ws/src/

      - name: Set artifact name
        run: |
          set -euo pipefail

          commit_sha="$(git rev-list -n 1 HEAD)"
          echo "ARTIFACT_NAME=release_${commit_sha}" >> "${GITHUB_ENV}"

      - name: Build release zip
        run: |
          set -euo pipefail

          (cd release && zip -r "../${ARTIFACT_NAME}.zip" .)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

      - name: Upload release asset
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          gh release upload "${RELEASE_TAG}" "${ARTIFACT_NAME}.zip" --clobber
